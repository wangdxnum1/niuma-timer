name: CI

on:
  push:
    branches: [main]
    # 只忽略 docs/**（设计文档/计划，无守卫测试针对它们）；根目录 **.md 不能忽略：
    # test_readme.js 守的恰是 README 双语与版本号、CHANGELOG 链接，忽略 **.md
    # 会让「只改文档」的提交把 README 改坏也全绿，守卫要等下次碰代码才补跑。
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 四个 job（frontend-tests / release-engine-tests / dep-audit / rust-checks）
  # 定义在 reusable workflow 里，与 release.yml 共用同一份——见 tests.yml 头注释
  tests:
    uses: ./.github/workflows/tests.yml
