<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: #e6e8ef;
        width: 320px;
        height: 240px;
        padding: 8px;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      .card {
        width: 100%;
        height: 100%;
        border-radius: 16px;
        padding: 12px 16px 10px;
        background: linear-gradient(160deg, rgba(29, 32, 41, 0.96) 0%, rgba(16, 18, 24, 0.96) 100%);
        border: 1px solid rgba(255, 214, 80, 0.3);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55);
        display: flex;
        flex-direction: column;
        gap: 6px;
        /* 初始隐藏，收到 hover_show 后平滑淡入 */
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.16s ease-out, transform 0.16s ease-out;
      }
      .card.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .title {
        font-size: 13px;
        font-weight: 700;
        color: #ffd650;
        letter-spacing: 0.5px;
      }
      .date {
        font-size: 11px;
        color: #8a90a2;
      }
      .earned {
        text-align: center;
        line-height: 1;
        margin: 2px 0 4px;
      }
      .amount {
        font-size: 32px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        background: linear-gradient(180deg, #ffe9a8 0%, #ffd650 55%, #e0a93a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .elabel {
        font-size: 11px;
        color: #8a90a2;
        margin-top: 3px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }
      .grid div {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        padding: 6px 2px 6px;
        text-align: center;
      }
      .grid span {
        display: block;
        font-size: 10px;
        color: #8a90a2;
        margin-bottom: 3px;
      }
      .grid b {
        display: block;
        font-size: 14px;
        color: #e6e8ef;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .foot {
        text-align: center;
        font-size: 11px;
        color: #7fd99a;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="head">
        <span class="title">🐎 牛马计时器</span>
        <span class="date" id="date">—</span>
      </div>
      <div class="earned">
        <div class="amount" id="earned">¥0.00</div>
        <div class="elabel">今日已赚</div>
      </div>
      <div class="grid">
        <div><span>已工作</span><b id="worked">—</b></div>
        <div><span>距下班</span><b id="toff">—</b></div>
        <div><span>赚钱速率</span><b id="rate">—</b></div>
        <div><span>距发薪</span><b id="pay">—</b></div>
      </div>
      <div class="foot" id="foot">—</div>
    </div>
    <script>
      // ===== 前端错误上报（emit 到 Rust 端 eprintln 打印，便于排查"不显示"类问题）=====
      function reportErr(msg) {
        try {
          window.__TAURI_INTERNALS__.invoke("plugin:event|emit", {
            event: "hover_error",
            payload: String(msg),
          });
        } catch (_) {}
      }
      window.addEventListener("error", function (e) {
        reportErr((e.message || "unknown") + " @ " + (e.filename || "") + ":" + (e.lineno || ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        reportErr("unhandledrejection: " + (r && r.message ? r.message : String(r)));
      });

      var card = document.getElementById("card");
      var shown = false; // 卡片是否已淡入

      // 时长：小数小时 → "5时10分30秒"，带秒、单行显示不换行
      function fmtDur(h) {
        if (h == null || isNaN(h) || h < 0) return "—";
        var total = Math.max(0, Math.round(h * 3600));
        var hh = Math.floor(total / 3600);
        var mm = Math.floor((total % 3600) / 60);
        var ss = total % 60;
        return hh + "时" + mm + "分" + ss + "秒";
      }

      // 数据由 Rust 端每秒 emit "hover_data" 推送
      function render(s) {
        document.getElementById("earned").textContent = "¥" + s.earned.toFixed(2);
        document.getElementById("worked").textContent = fmtDur(s.worked_h);
        document.getElementById("toff").textContent = s.is_workday
          ? s.off_work ? "已下班" : fmtDur(s.to_off_h)
          : "休息中";
        document.getElementById("rate").textContent = "¥" + s.rate_per_min.toFixed(2) + "/分";
        document.getElementById("pay").textContent = s.days_to_pay + " 天";
        var now = new Date();
        var wd = ["日", "一", "二", "三", "四", "五", "六"][now.getDay()];
        document.getElementById("date").textContent =
          now.getMonth() + 1 + "月" + now.getDate() + "日 周" + wd;
        document.getElementById("foot").textContent = s.is_workday
          ? "搬砖中，冲鸭 🐂"
          : "今天休息 🛌";
      }

      // 淡入（幂等，防重复触发闪烁）
      function showCard() {
        if (shown) return;
        shown = true;
        card.classList.add("visible");
      }

      // 淡出：动画结束后由 transitionend 隐藏窗口
      function hideCard() {
        if (!shown) return;
        shown = false;
        card.classList.remove("visible");
      }

      // ===== 前端自治淡入（主机制，不依赖事件时序）=====
      // 懒创建场景下 WebView2 页面加载耗时不定（几百 ms~1s+），Rust 端事件
      // 可能先于页面就绪到达而丢失。因此让窗口可见性直接驱动淡入：
      //  - 窗口 show() 晚于页面加载 → visibilitychange 触发淡入
      //  - 窗口 show() 先于页面加载 → 页面加载完时检查可见状态兜底淡入
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") {
          showCard();
        } else {
          hideCard();
        }
      });
      if (document.visibilityState === "visible") {
        showCard();
      }

      // 淡出动画结束 → 隐藏窗口（需要 hover_card 窗口的 allow-hide 权限）
      card.addEventListener("transitionend", function (e) {
        if (e.propertyName === "opacity" && !card.classList.contains("visible")) {
          window.__TAURI_INTERNALS__.invoke("plugin:window|hide", {});
        }
      });

      function listen(name, fn) {
        window.__TAURI_INTERNALS__.invoke("plugin:event|listen", {
          event: name,
          target: { kind: "Any" },
          handler: window.__TAURI_INTERNALS__.transformCallback(fn),
        }).catch(function (err) {
          reportErr("listen(" + name + ") failed: " + err);
        });
      }
      // 鼠标悬停托盘 → 淡入（Rust 端重试发送，页面未就绪时由 hover_ready 握手兜底）
      listen("hover_show", showCard);
      // 鼠标离开托盘 → 淡出
      listen("hover_hide", hideCard);
      // 实时数据推送
      listen("hover_data", function (e) {
        render(e.payload);
      });

      // 页面加载完成 → 通知 Rust：若鼠标仍悬停在托盘上，补一次定位 + 淡入。
      // 这是"首次悬停事件丢失"的最终兜底，不依赖任何窗口可见性猜测。
      window.__TAURI_INTERNALS__.invoke("plugin:event|emit", {
        event: "hover_ready",
        payload: null,
      });
    </script>
  </body>
</html>
