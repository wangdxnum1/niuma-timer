<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>牛马计时器 · 设置</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <h1>🐎 牛马计时器</h1>
      <p class="sub">实时计算你今天赚了多少钱</p>

      <section class="card">
        <h2>基础设置</h2>
        <label>
          <span>月薪（元）</span>
          <input id="monthly_salary" type="number" min="0" step="100" />
        </label>
        <div class="row">
          <label>
            <span>上午上班</span>
            <input id="am_start" type="time" />
          </label>
          <label>
            <span>上午下班</span>
            <input id="am_end" type="time" />
          </label>
        </div>
        <div class="row">
          <label>
            <span>下午上班</span>
            <input id="pm_start" type="time" />
          </label>
          <label>
            <span>下午下班</span>
            <input id="pm_end" type="time" />
          </label>
        </div>
        <label>
          <span>发薪日（每月几号）</span>
          <input id="payday" type="number" min="1" max="31" />
        </label>
        <label>
          <span>时长显示格式</span>
          <select id="duration_format">
            <option value="hms">几小时几分几秒（如 5小时10分30秒）</option>
            <option value="hm">几小时几分（如 5小时10分）</option>
            <option value="h">小数小时（如 5.2h）</option>
          </select>
        </label>
        <label class="switch-row">
          <span>托盘悬停显示彩色卡片</span>
          <input id="tray_hover_card" type="checkbox" class="switch" />
        </label>
        <label>
          <span>当月实际上班天数（留空=自动）</span>
          <input id="workdays_override" type="number" min="1" max="31" placeholder="自动获取" />
        </label>
        <button id="refreshBtn" class="ghost">刷新工作日数据</button>
        <div id="workdaysInfo" class="hint"></div>
      </section>

      <section class="card">
        <h2>加班设置</h2>
        <label class="switch-row">
          <span>启用加班追踪</span>
          <input id="overtime_enabled" type="checkbox" class="switch" />
        </label>
        <label>
          <span>加班起算时间（留空=下班时间）</span>
          <input id="overtime_start" type="time" placeholder="下班时间" />
        </label>
        <label>
          <span>加班费（元/小时）</span>
          <input id="overtime_rate" type="number" min="0" step="5" value="20" />
        </label>
        <label class="switch-row">
          <span>饭补</span>
          <input id="overtime_meal_enabled" type="checkbox" class="switch" />
        </label>
        <label>
          <span>饭补金额（元）</span>
          <input id="overtime_meal" type="number" min="0" step="5" value="20" />
        </label>
      </section>

      <section class="card live">
        <h2>今日实时</h2>
        <div class="big" id="earned">¥0.00</div>
        <div class="grid">
          <div><span>已工作</span><b id="worked">0.0h</b></div>
          <div><span>距下班</span><b id="toff">—</b></div>
          <div><span>速率</span><b id="rate">¥0.00/分</b></div>
          <div><span>距发薪</span><b id="pay">—</b></div>
        </div>
      </section>

      <section class="card">
        <h2>加班记录</h2>
        <div class="big" id="ot_total">¥0.00</div>
        <p class="sub">本月加班合计</p>
        <div class="grid">
          <div><span>有效时长</span><b id="ot_hours">0.0h</b></div>
          <div><span>加班天数</span><b id="ot_days">0</b></div>
          <div><span>饭补合计</span><b id="ot_meal_total">¥0.00</b></div>
          <div><span>日均</span><b id="ot_avg">¥0.00</b></div>
        </div>
        <table class="ot-table">
          <thead>
            <tr><th>日期</th><th>锁屏</th><th>有效</th><th>加班费</th><th>饭补</th><th>合计</th></tr>
          </thead>
          <tbody id="ot_tbody"></tbody>
        </table>
      </section>
    </div>
    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
