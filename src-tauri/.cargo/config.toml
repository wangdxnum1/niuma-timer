# 项目级 Cargo 配置
# 注：此处不要硬编码 RC_x86_64-pc-windows-msvc 指向某个 Windows SDK 版本目录。
# tauri-winres → embed-resource 会优先读取 RC_{TARGET}，一旦指向本机未安装的 SDK
# 版本（如 10.0.28000.0），rc.exe 无法启动，构建直接失败。它自身已能从注册表
# 的 Windows Kits\Installed Roots 里发现可用版本，交给它自动查找即可。

# 静态链接 MSVC CRT（/MT），让发布版 exe 不依赖目标机的「Visual C++ Redistributable」。
# 否则 cargo build 出的动态 CRT exe 在缺 VC++ 运行库的干净 Win11 上无法启动（表现为双击无反应）。
# 仅影响 MSVC target；GNU/Mac/Linux 构建忽略此 flag。
[build]
rustflags = ["-C", "target-feature=+crt-static"]
