[package]
name = "niuma-timer"
version = "1.0.0"
description = "牛马计时器 - 实时显示今天赚了多少钱、上了多少小时班"
authors = ["Tim"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
png = "0.17"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
] }

[features]
# Tauri 2 默认 feature 已包含所需能力；此处留空。

# Release 产物裁剪：thin LTO + 单 codegen unit 缩体积并略提运行速度，strip 去符号。
# 注意：刻意**不加** panic = "abort"——scheduler 的 catch_unwind 自愈设计
#（单任务 panic 只丢一拍、不扩散拖垮整个托盘）依赖 unwind 语义，abort 会让它失效。
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
